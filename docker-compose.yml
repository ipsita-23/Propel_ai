version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fault_localization
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  backend:
    build: 
      context: ./backend
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/fault_localization
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  simulator:
    build:
      context: ./simulator
    environment:
      - API_URL=http://backend:8000
      - DATABASE_URL=postgresql://user:password@db:5432/fault_localization
    ports:
      - "8081:8080"
    depends_on:
      - backend
    volumes:
      - ./simulator:/app

volumes:
  db_data:
  redis_data:
